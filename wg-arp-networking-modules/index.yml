#@data/values
---
#@overlay/match missing_ok=True

#! <OPTIONAL> if your pipeline needs to run with DB
db_flavors:
- image: postgres
  value: postgres
- image: mysql-8.0
  value: mysql
- image: mysql-8.4
  value: mysql
- image: mysql-9.7
  value: mysql

#! <MUST> repo/component/package to test in your repo/release
windows_tags:
- wg-arp-networking-modules

internal_repos:
- name: cf-networking-helpers
  repo: cloudfoundry/cf-networking-helpers
  on_windows: true
  tag: wg-arp-networking-modules
  configure_db: true
- name: policy_client
  repo: cloudfoundry/policy_client
- name: routing-api
  repo: cloudfoundry/routing-api
  configure_db: true
